<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Konversi Suhu</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div class="container">
        <h2>Kalkulator Konversi Suhu</h2>
        <label for="celsius">Celsius (°C):</label>
        <input type="number" id="celsius" placeholder="Masukkan suhu Celsius">
        <button onclick="convertToFahrenheit()">Konversi ke Fahrenheit</button>

        <label for="fahrenheit">Fahrenheit (°F):</label>
        <input type="number" id="fahrenheit" placeholder="Masukkan suhu Fahrenheit">
        <button onclick="convertToCelsius()">Konversi ke Celsius</button>

        <p id="result"></p>
        <p id="explanation"></p>
    </div>
</body>

</html>
